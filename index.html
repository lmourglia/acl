<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex,nofollow">
<title>ACL · Red de socios</title>

<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#EFEDE7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141210" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ACL">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./favicon.png" sizes="32x32">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style id="app-css">
:root{
  --ground:#EFEDE7; --surface:#FFFFFF; --surface2:#F7F5F1; --line:#DCD7CE;
  --ink:#1B1815; --ink2:#4A443C; --muted:#7C736A;
  --accent:#B4531F; --accent-soft:#F6E4D8; --accent-ink:#7A3512;
  --critical:#96161C; --critical-soft:#F7DEDE;
  --good:#16694A; --good-soft:#DCEDE4;
  --warn:#A8760B; --warn-soft:#FBEDCF;
  --cold:#1D5A78; --cold-soft:#DCEAF2;
  --radius:14px; --tap:48px;
  --shadow:0 1px 2px rgba(27,24,21,.06),0 6px 18px rgba(27,24,21,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#141210; --surface:#211E1A; --surface2:#2A2622; --line:#3A342E;
  --ink:#F2EFE9; --ink2:#C4BCB1; --muted:#948A7E;
  --accent:#E07B3E; --accent-soft:#3C2517; --accent-ink:#F0A672;
  --critical:#E8615F; --critical-soft:#3E1A1A;
  --good:#5FBF8F; --good-soft:#17301F;
  --warn:#E0AA3C; --warn-soft:#332714;
  --cold:#7FB6D4; --cold-soft:#15272F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --ground:#141210; --surface:#211E1A; --surface2:#2A2622; --line:#3A342E;
  --ink:#F2EFE9; --ink2:#C4BCB1; --muted:#948A7E;
  --accent:#E07B3E; --accent-soft:#3C2517; --accent-ink:#F0A672;
  --critical:#E8615F; --critical-soft:#3E1A1A;
  --good:#5FBF8F; --good-soft:#17301F;
  --warn:#E0AA3C; --warn-soft:#332714;
  --cold:#7FB6D4; --cold-soft:#15272F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:Archivo,"Helvetica Neue",Arial,sans-serif;
  font-size:16px; line-height:1.45; -webkit-text-size-adjust:100%;
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;padding:0}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.shell{max-width:600px;margin:0 auto;min-height:100dvh;background:var(--ground);
  display:flex;flex-direction:column;position:relative}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:30;background:var(--ground);
  border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 16px 8px}
.top-row{display:flex;align-items:baseline;gap:10px}
.brand{font-family:"Bricolage Grotesque",Archivo,sans-serif;font-weight:800;
  font-size:19px;letter-spacing:-.02em;line-height:1}
.brand small{font-weight:600;font-size:12px;color:var(--muted);margin-left:7px;letter-spacing:0}
.saved{margin-left:auto;font-size:11px;font-weight:600;letter-spacing:.02em}
.saved.ok{color:var(--muted)} .saved.busy{color:var(--warn)} .saved.err{color:var(--critical)}
.bar{margin-top:8px;height:6px;border-radius:999px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .b-ok{background:var(--good)} .bar .b-go{background:var(--accent)}
.barlab{margin-top:5px;display:flex;gap:12px;font-size:11.5px;color:var(--muted);
  font-weight:600;font-variant-numeric:tabular-nums}
.barlab em{font-style:normal;color:var(--ink2)}

/* ---------- main ---------- */
main{flex:1;padding:14px 12px calc(86px + env(safe-area-inset-bottom))}
.sec{margin:0 0 20px}
.sec-h{display:flex;align-items:center;gap:8px;margin:0 4px 9px;
  font-family:"Bricolage Grotesque",Archivo,sans-serif;font-weight:700;
  font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.sec-h .cnt{font-family:Archivo,sans-serif;letter-spacing:0;background:var(--line);
  color:var(--ink2);border-radius:999px;padding:1px 8px;font-size:11.5px}
.sec.urg .sec-h{color:var(--critical)} .sec.urg .sec-h .cnt{background:var(--critical-soft);color:var(--critical)}
.sec.hoy .sec-h{color:var(--warn)} .sec.hoy .sec-h .cnt{background:var(--warn-soft);color:var(--warn)}

.list{display:flex;flex-direction:column;gap:8px}
.card{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);padding:12px 13px 12px 15px;position:relative;overflow:hidden;
  box-shadow:var(--shadow);display:block;min-height:var(--tap);transition:transform .12s ease}
.card:active{transform:scale(.985)}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--line)}
.card.s-urg::before{background:var(--critical)}
.card.s-hoy::before{background:var(--warn)}
.card.s-new::before{background:var(--accent)}
.card.s-ok::before{background:var(--good)}
.card.s-zzz::before{background:var(--critical)}
.c-top{display:flex;align-items:flex-start;gap:8px}
.c-name{font-weight:700;font-size:15.5px;line-height:1.25;letter-spacing:-.01em;flex:1;text-wrap:balance}
.c-sub{margin-top:3px;font-size:13px;color:var(--muted);line-height:1.3}
.c-chips{margin-top:7px;display:flex;flex-wrap:wrap;align-items:center;gap:5px}
.c-next{margin-top:8px;display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink2);line-height:1.3}
.c-next .dot{width:5px;height:5px;border-radius:99px;background:var(--accent);flex:none}
.c-when{margin-top:6px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.c-when.urg{color:var(--critical)} .c-when.hoy{color:var(--warn)} .c-when.fut{color:var(--muted)}

.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;
  padding:2px 8px;font-size:11px;font-weight:700;letter-spacing:.03em;white-space:nowrap;flex:none}
.t-Caliente{background:var(--accent);color:#fff}
.t-Tibio{background:var(--warn-soft);color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn)}
.t-Frio{background:var(--cold-soft);color:var(--cold);box-shadow:inset 0 0 0 1px var(--cold)}
.t-none{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.e-chip{font-size:11px;line-height:1.5;font-weight:700;padding:2px 8px;border-radius:999px;flex:none;
  background:var(--surface2);color:var(--ink2);white-space:nowrap;
  box-shadow:inset 0 0 0 1px var(--line)}
.e-chip.e-act{background:var(--good-soft);color:var(--good);box-shadow:none}
.e-chip.e-zzz{background:var(--critical-soft);color:var(--critical);box-shadow:none}
.e-chip.e-alta{background:var(--accent-soft);color:var(--accent-ink);box-shadow:none}
.e-chip.e-co{background:var(--surface2);color:var(--muted)}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);
  padding:16px;color:var(--muted);font-size:13.5px;line-height:1.5}
.empty b{display:block;color:var(--ink2);font-size:14.5px;margin-bottom:3px}
.note{font-size:12.5px;color:var(--muted);line-height:1.45;margin:8px 0 0}

/* ---------- tabs ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs-in{max-width:600px;margin:0 auto;display:flex}
.tab{flex:1;min-height:60px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;color:var(--muted);font-size:11px;font-weight:600;position:relative}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--accent)}
.badge{position:absolute;top:8px;right:calc(50% - 22px);background:var(--critical);color:#fff;
  font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:999px;
  display:flex;align-items:center;justify-content:center;padding:0 4px}

/* ---------- filtros y búsqueda ---------- */
.search{margin:0 4px 10px}
.search input{width:100%;min-height:var(--tap);border:1px solid var(--line);
  border-radius:var(--radius);background:var(--surface);padding:10px 13px;font-size:16px}
.fbar{display:flex;gap:7px;overflow-x:auto;padding:0 4px 10px;-webkit-overflow-scrolling:touch;
  scrollbar-width:none}
.fbar::-webkit-scrollbar{display:none}
.fb{flex:none;min-height:38px;padding:7px 13px;border-radius:999px;background:var(--surface);
  box-shadow:inset 0 0 0 1px var(--line);font-size:13px;font-weight:600;color:var(--ink2);white-space:nowrap}
.fb[aria-pressed="true"]{background:var(--accent);color:#fff;box-shadow:none}
.selrow{display:flex;gap:8px;padding:0 4px 12px;flex-wrap:wrap}
.selrow select{flex:1;min-width:calc(50% - 4px);min-height:42px;border:1px solid var(--line);
  border-radius:11px;background:var(--surface);padding:8px 10px;font-size:14px;
  -webkit-appearance:none;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 16px) 19px,calc(100% - 11px) 19px;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.selrow select.on{box-shadow:inset 0 0 0 1.5px var(--accent);color:var(--accent-ink)}

.addbtn{width:100%;min-height:var(--tap);margin-top:9px;border-radius:var(--radius);
  background:var(--accent);color:#fff;font-weight:700;font-size:15px;
  display:flex;align-items:center;justify-content:center;gap:8px}
.addbtn.sec2{background:var(--surface);color:var(--ink2);box-shadow:inset 0 0 0 1.5px var(--line)}

/* ---------- tablero ---------- */
.seg{display:flex;gap:6px;background:var(--surface2);padding:4px;border-radius:12px;margin:0 4px 14px}
.seg button{flex:1;min-height:38px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:0 4px 20px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:12px 13px;box-shadow:var(--shadow)}
.kpi.wide{grid-column:1 / -1}
.k-l{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.k-v{font-family:"Bricolage Grotesque",Archivo,sans-serif;font-weight:800;font-size:30px;
  line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.k-n{font-size:12px;color:var(--muted);margin-top:3px;font-weight:600}
.k-n.up{color:var(--good)} .k-n.down{color:var(--critical)}
.funnel{display:flex;flex-direction:column;gap:7px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--radius);padding:13px;box-shadow:var(--shadow)}
.fr{display:flex;align-items:center;gap:9px;font-size:13px}
.fl{width:88px;flex:none;color:var(--ink2);font-weight:600;font-size:12.5px}
.ft{flex:1;height:9px;border-radius:999px;background:var(--surface2);overflow:hidden}
.ft i{display:block;height:100%;background:var(--accent);border-radius:999px}
.fr.g .ft i{background:var(--good)}
.fr.r .ft i{background:var(--critical)}
.fn{width:26px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums;font-size:13px}

/* ---------- ficha ---------- */
.sheet{position:fixed;inset:0;z-index:60;background:var(--ground);overflow-y:auto;
  -webkit-overflow-scrolling:touch}
.sh-top{position:sticky;top:0;z-index:5;background:var(--ground);border-bottom:1px solid var(--line)}
.sh-in{max-width:600px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 14px 11px}
.sh-row{display:flex;align-items:flex-start;gap:10px}
.sh-name{font-family:"Bricolage Grotesque",Archivo,sans-serif;font-weight:800;font-size:20px;
  line-height:1.15;letter-spacing:-.02em;flex:1;text-wrap:balance}
.x{width:38px;height:38px;flex:none;border-radius:999px;background:var(--surface2);
  color:var(--ink2);font-size:16px;display:flex;align-items:center;justify-content:center}
.sh-meta{margin-top:9px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.sh-body{max-width:600px;margin:0 auto;padding:14px 12px calc(40px + env(safe-area-inset-bottom))}
.blk{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:13px;margin-bottom:11px;box-shadow:var(--shadow)}
.blk-h{font-family:"Bricolage Grotesque",Archivo,sans-serif;font-weight:700;font-size:12.5px;
  letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:11px;
  display:flex;align-items:center;gap:8px}
.blk-h .cnt{font-family:Archivo,sans-serif;letter-spacing:0;background:var(--line);
  color:var(--ink2);border-radius:999px;padding:1px 8px;font-size:11.5px}
.linkrow{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin:-2px 0}
.linkrow::-webkit-scrollbar{display:none}
.lnk{flex:none;min-height:var(--tap);padding:0 15px;border-radius:999px;background:var(--accent-soft);
  color:var(--accent-ink);font-weight:700;font-size:14px;text-decoration:none;
  display:inline-flex;align-items:center;gap:7px}
.lnk svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
.fld{margin-bottom:11px}
.fld label{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin-bottom:5px}
.fld input,.fld textarea,.fld select{width:100%;min-height:var(--tap);border:1px solid var(--line);
  border-radius:11px;background:var(--surface2);padding:11px 12px;font-size:16px}
.fld textarea{min-height:84px;resize:vertical;line-height:1.45}
.fld select{-webkit-appearance:none;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 17px) 22px,calc(100% - 12px) 22px;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.two{display:flex;gap:9px}
.two .fld{flex:1;min-width:0}
.logs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.act{min-height:var(--tap);border-radius:11px;background:var(--accent);color:#fff;
  font-weight:700;font-size:14.5px;padding:10px 12px;text-align:center;line-height:1.2}
.act.ghost{background:var(--surface2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.act.ok{background:var(--good);color:#fff}
.act.no{background:var(--surface2);color:var(--critical);box-shadow:inset 0 0 0 1px var(--critical)}
.states{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.states::-webkit-scrollbar{display:none}
.st{flex:none;min-height:40px;padding:8px 14px;border-radius:999px;background:var(--surface2);
  box-shadow:inset 0 0 0 1px var(--line);font-size:13.5px;font-weight:600;white-space:nowrap}
.st[aria-pressed="true"]{background:var(--accent);color:#fff;box-shadow:none}
.st.good[aria-pressed="true"]{background:var(--good)}
.st.bad[aria-pressed="true"]{background:var(--critical)}
.temps{display:flex;gap:8px}
.tb{flex:1;min-height:var(--tap);border-radius:11px;background:var(--surface2);
  box-shadow:inset 0 0 0 1px var(--line);font-size:14px;font-weight:600}
.tb[aria-pressed="true"]{color:#fff;box-shadow:none}
.tb.c[aria-pressed="true"]{background:var(--accent)}
.tb.t[aria-pressed="true"]{background:var(--warn)}
.tb.f[aria-pressed="true"]{background:var(--cold)}
.quick{display:flex;gap:7px;flex-wrap:wrap}
.qb{min-height:40px;padding:8px 13px;border-radius:999px;background:var(--surface2);
  box-shadow:inset 0 0 0 1px var(--line);font-size:13.5px;font-weight:600}
.chk{display:flex;align-items:center;gap:11px;min-height:var(--tap);width:100%;text-align:left;
  padding:6px 0;border-bottom:1px solid var(--line)}
.chk:last-child{border-bottom:none}
.chk .bx{width:26px;height:26px;flex:none;border-radius:8px;box-shadow:inset 0 0 0 1.5px var(--line);
  display:flex;align-items:center;justify-content:center;font-size:15px;color:transparent}
.chk[aria-pressed="true"] .bx{background:var(--good);box-shadow:none;color:#fff}
.chk .lb{flex:1;font-size:14.5px;font-weight:600}
.chk[aria-pressed="true"] .lb{color:var(--muted);text-decoration:line-through}
.chk .dt{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ag{background:var(--surface2);border-radius:12px;padding:12px;margin-bottom:10px;
  box-shadow:inset 0 0 0 1px var(--line)}
.ag-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.ag-t{flex:1;font-weight:700;font-size:14.5px;letter-spacing:-.01em}
.ag-x{width:34px;height:34px;flex:none;border-radius:999px;background:var(--surface);
  color:var(--muted);font-size:14px;display:flex;align-items:center;justify-content:center}
.ag .fld input,.ag .fld textarea,.ag .fld select{background:var(--surface)}
.dl{display:flex;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.dl:last-child{border-bottom:none}
.dl dt{width:110px;flex:none;color:var(--muted);font-size:13px}
.dl dd{margin:0;flex:1;min-width:0;overflow-wrap:anywhere}
.tl{display:flex;flex-direction:column}
.ev{display:flex;gap:11px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.ev:last-child{border-bottom:none}
.ed{width:46px;flex:none;color:var(--muted);font-size:12.5px;font-weight:600;
  font-variant-numeric:tabular-nums;padding-top:1px}
.et{flex:1;min-width:0}
.et small{display:block;color:var(--muted);font-size:13px;margin-top:2px;overflow-wrap:anywhere}
.desh{flex:none;font-size:12px;font-weight:700;color:var(--critical);padding:2px 3px 2px 10px}
.danger{width:100%;min-height:44px;border-radius:11px;color:var(--critical);font-size:13.5px;
  font-weight:600;box-shadow:inset 0 0 0 1px var(--critical-soft);background:var(--critical-soft)}

/* ---------- configuración ---------- */
.cfg-item{display:flex;align-items:center;gap:9px;min-height:44px;
  border-bottom:1px solid var(--line);font-size:14.5px}
.cfg-item:last-of-type{border-bottom:none}
.cfg-item .nm{flex:1;min-width:0}
.cfg-item .tg{font-size:11px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);
  border-radius:999px;padding:2px 8px;white-space:nowrap}
.cfg-x{width:34px;height:34px;flex:none;border-radius:999px;background:var(--surface2);
  color:var(--muted);font-size:14px;display:flex;align-items:center;justify-content:center}
.addrow{display:flex;gap:8px;margin-top:11px}
.addrow input{flex:1;min-width:0;min-height:44px;border:1px solid var(--line);border-radius:11px;
  background:var(--surface2);padding:10px 12px;font-size:16px}
.addrow button{flex:none;min-height:44px;padding:0 16px;border-radius:11px;background:var(--accent);
  color:#fff;font-weight:700;font-size:14px}
.swrow{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:13.5px;color:var(--ink2)}
.swrow input{width:20px;height:20px;flex:none;accent-color:var(--accent)}
.quien{text-align:center;color:var(--muted);font-size:12.5px;margin:18px 0 10px}
.salir{width:100%;min-height:46px;border-radius:11px;background:var(--surface);
  box-shadow:inset 0 0 0 1px var(--line);color:var(--ink2);font-weight:600;font-size:14px;margin-top:9px}

/* ---------- carga por lista ---------- */

.toast{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(78px + env(safe-area-inset-bottom));z-index:90;
  background:var(--ink);color:var(--ground);padding:11px 17px;border-radius:999px;

@keyframes up{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}

<body>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<script id="app-script">
(function(){
"use strict";

/* =====================================================================
   CONFIGURACIÓN — pegá acá los dos valores de Supabase
   Supabase -> tu proyecto -> Settings -> API Keys -> Publishable key
   ===================================================================== */
var SUPABASE_URL = "https://uxlokriwxybeugdkicbm.supabase.co";
var SUPABASE_KEY = "sb_publishable_ZDtM_CMt7bFN021tt1LMtQ_Rt7l_Bih";
/* ===================================================================== */

var PAGINA_SRC = "<!doctype html>\n" + document.documentElement.outerHTML;
var CFG = "acl_cfg_v1";
var CACHE = "acl_cache_v1";
try{var _c=JSON.parse(localStorage.getItem(CFG)||"null");
  if(_c&&_c.url&&_c.key){SUPABASE_URL=_c.url;SUPABASE_KEY=_c.key;}}catch(_x){}

var sb=null, sesion=null, miEmail="";
var ROOT=document.getElementById("root");

/* Valores por defecto: si la tabla config está vacía, la app igual arranca. */
var DEF={
  companias:["ATM Seguros","Berkley","Mercantil Andina","Triunfo","CNP","Life"],
  ramas:["Automotor","Motovehículo","Náutica","Vida","Ahorro","ART","Caución","Hogar","Comercio"],
  tipos:[{n:"Agencia de autos",ag:true},{n:"Agencia de motos",ag:true},
         {n:"Agencia náutica",ag:true},{n:"Datero",ag:false},
         {n:"Vendedor independiente",ag:false},{n:"Profesional",ag:false}],
  pasos:["Papeles","Matrícula","Alta de subusuario","Capacitación"],
  dias_dormido:30, dias_alta:15
};
var S={socios:[], cfg:JSON.parse(JSON.stringify(DEF))};

/* ---------- el embudo ---------- */
var ORDEN=["Identificado","Contactado","Reunión","Interesado","En alta","Activo","Dormido","Descartado"];
var FIJOS={"Interesado":1,"En alta":1,"Activo":1,"Dormido":1,"Descartado":1};
/* En la lista de Socios primero va lo que pide acción, no el orden del embudo. */
var ORDEN_LISTA=["Dormido","En alta","Interesado","Reunión","Contactado","Activo",
                 "Identificado","Descartado"];
var CERRADO={"Descartado":1};
var TEMPS=["Frío","Tibio","Caliente"];
var PAGOS=["Comisión asignada (%)","Se queda con la cuota 1","Monto fijo por póliza",
           "Mixto","A definir"];

/* ---------- helpers ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function pad(n){return n<10?"0"+n:""+n;}
function isoDe(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function hoyISO(){return isoDe(new Date());}
function masDias(n){var d=new Date();d.setDate(d.getDate()+n);return isoDe(d);}
function dmy(iso){if(!iso)return"";var p=String(iso).split("-");return p[2]+"/"+p[1];}
function dmya(iso){if(!iso)return"";var p=String(iso).split("-");return p[2]+"/"+p[1]+"/"+p[0];}
function diasEntre(a,b){return Math.round((Date.parse(b+"T00:00:00")-Date.parse(a+"T00:00:00"))/864e5);}
function key(s){return String(s||"").replace(/[^A-Za-z]/g,"");}
function num(v,d){var n=Number(v);return isNaN(n)?d:n;}
function plural(n,s,p){return n+" "+(n===1?s:p);}

/* Teléfonos argentinos: acepta 0362 15-412-3456, +54 362 458-0300, 362 4580300 */
function normTel(raw){
  var s=String(raw||"").trim();
  if(!s)return "";
  if(s.charAt(0)==="+")return s.replace(/[^\d]/g,"");
  var d=s.replace(/[^\d]/g,"");
  if(!d)return "";
  if(/^0?8[0-9]{2}/.test(d))return "";           // 0800 / 0810: no hay WhatsApp
  if(d.indexOf("54")===0&&d.length>=12)return d;
  if(d.charAt(0)==="0")d=d.slice(1);
  if(d.indexOf("15")===0&&d.length>=10)d=d.slice(2);
  // sacar el 15 después de la característica (2 a 4 dígitos)
  for(var c=2;c<=4;c++){
    if(d.length>=12&&d.substr(c,2)==="15"){d=d.slice(0,c)+d.slice(c+2);break;}
  }
  if(d.length<10)return "";
  return "549"+d;
}
function telCrudo(e){return (e.tel||e.wa||"").trim();}
function telHref(e){var t=telCrudo(e);return t?t.replace(/[^\d+]/g,""):"";}
function waHref(e){
  var f=(e.wa||"").trim();
  if(f.charAt(0)==="+")return f.replace(/[^\d]/g,"");
  return normTel(f||e.tel);
}
function waLindo(e){
  var n=waHref(e); if(!n)return "";
  if(n.indexOf("549")===0){var r=n.slice(3);
    return "+54 9 "+r.slice(0,3)+" "+r.slice(3,6)+"-"+r.slice(6);}
  return "+"+n;
}

/* ---------- configuración: listas editables ---------- */
function lista(k){var v=S.cfg[k];return Array.isArray(v)?v:(DEF[k]||[]);}
function companias(){return lista("companias");}
function ramas(){return lista("ramas");}
function tipos(){return lista("tipos");}
function pasos(){return lista("pasos");}
function diasDormido(){return num(S.cfg.dias_dormido,30);}
function diasAlta(){return num(S.cfg.dias_alta,15);}
function esAgencia(ti){
  var t=tipos();
  for(var i=0;i<t.length;i++)if(t[i].n===ti)return !!t[i].ag;
  return false;
}

/* ---------- guardado ---------- */
var estadoGuardado="ok", cola={}, timers={}, ultimaEscritura={}, reintento=null;

function marcar(st){
  estadoGuardado=st;
  var el=document.getElementById("saved");
  if(el){el.className="saved "+st;el.textContent=
    st==="busy"?"Guardando…":st==="err"?"Sin guardar":"Guardado";}
}
function cachear(){try{localStorage.setItem(CACHE,JSON.stringify(S));}catch(x){}}

/* guardar(e) manda UN socio. Cada socio viaja solo, así dos personas
   editando socios distintos nunca se pisan. */
function guardar(e){
  if(!e)return;
  cachear(); marcar("busy");
  cola[e.id]=e;
  if(timers[e.id])clearTimeout(timers[e.id]);
  timers[e.id]=setTimeout(function(){enviar(e.id);},700);
}
function enviar(id){
  var e=cola[id]; if(!e)return;
  if(!sb){marcar("err");programarReintento();return;}
  ultimaEscritura[id]=Date.now();
  sb.from("socios").upsert({id:e.id,datos:e,actualizado:new Date().toISOString(),por:miEmail})
    .then(function(r){
      if(r.error){marcar("err");programarReintento();return;}
      delete cola[id];
      if(Object.keys(cola).length===0)marcar("ok");
    },function(){marcar("err");programarReintento();});
}
/* Si no hay señal, la app reintenta sola cada 15 segundos y cuando vuelve
   la conexión. Nada de lo que cargaste se pierde mientras la app siga abierta. */
function programarReintento(){
  if(reintento)return;
  reintento=setInterval(function(){
    var ids=Object.keys(cola);
    if(!ids.length){clearInterval(reintento);reintento=null;return;}
    ids.forEach(enviar);
  },15000);
}
window.addEventListener("online",function(){
  Object.keys(cola).forEach(enviar);
  if(Object.keys(cola).length)toast("Volvió la señal, guardando lo pendiente");
});

var tCfg=null;
function guardarCfg(){
  cachear(); marcar("busy");
  if(!sb){marcar("err");return;}
  if(tCfg)clearTimeout(tCfg);
  tCfg=setTimeout(function(){
    var filas=Object.keys(S.cfg).map(function(k){return {k:k,v:S.cfg[k]};});
    sb.from("config").upsert(filas).then(function(r){r.error?marcar("err"):marcar("ok");},
      function(){marcar("err");});
  },600);
}
function toast(msg){
  var old=document.querySelector(".toast"); if(old)old.remove();
  var t=document.createElement("div");t.className="toast";t.textContent=msg;
  document.body.appendChild(t);setTimeout(function(){if(t.parentNode)t.remove();},2800);
}

/* ---------- consultas sobre los socios ---------- */
var V={tab:"hoy", q:"", fTipo:"", fEstado:"", fRama:"", fComp:"", abierta:null,
       verMas:false, per:"semana", imp:null};

function porId(id){for(var i=0;i<S.socios.length;i++)if(S.socios[i].id===id)return S.socios[i];return null;}
function ultMov(e){return (e.log&&e.log.length)?e.log[e.log.length-1].f:"";}
function diasQuieto(e){var f=ultMov(e);return f?diasEntre(f,hoyISO()):9999;}
function tieneRama(e,r){
  if(!r)return true;
  return (e.ac||[]).some(function(a){return a.ra===r;});
}
function tieneComp(e,c){
  if(!c)return true;
  return (e.ac||[]).some(function(a){return a.co===c;});
}
function estadoDe(e){
  if(CERRADO[e.es])return "cerr";
  if(e.es==="Dormido")return "zzz";
  if(e.pxf){var d=diasEntre(hoyISO(),e.pxf);
    if(d<0)return "urg"; if(d===0)return "hoy"; return e.es==="Activo"?"ok":"fut";}
  if(e.es==="Activo")return "ok";
  return e.es==="Identificado"?"new":"fut";
}
function chipEstado(es){
  var c=es==="Activo"?"e-act":es==="Dormido"?"e-zzz":es==="En alta"?"e-alta":
        es==="Descartado"?"e-co":"";
  return '<span class="e-chip '+c+'">'+esc(es)+'</span>';
}
function chipTemp(t){
  if(!t)return '<span class="chip t-none">Sin calificar</span>';
  return '<span class="chip t-'+(t==="Frío"?"Frio":key(t))+'">'+esc(t)+'</span>';
}

function vencidas(){return S.socios.filter(function(e){
  return !CERRADO[e.es]&&e.pxf&&diasEntre(hoyISO(),e.pxf)<0;})
  .sort(function(a,b){return a.pxf<b.pxf?-1:1;});}
function paraHoy(){return S.socios.filter(function(e){
  return !CERRADO[e.es]&&e.pxf&&diasEntre(hoyISO(),e.pxf)===0;});}
function estaSemana(){return S.socios.filter(function(e){
  if(CERRADO[e.es]||!e.pxf)return false;var d=diasEntre(hoyISO(),e.pxf);return d>0&&d<=7;})
  .sort(function(a,b){return a.pxf<b.pxf?-1:1;});}
function sinTocar(){return S.socios.filter(function(e){
  return e.es==="Identificado"&&!e.pxf;})
  .sort(function(a,b){
    var r={"Caliente":0,"Tibio":1,"Frío":2};
    var d=(r[a.temp]===undefined?3:r[a.temp])-(r[b.temp]===undefined?3:r[b.temp]);
    return d!==0?d:(a.n<b.n?-1:1);});}

/* Las dos alertas del negocio */
function posiblesDormidos(){return S.socios.filter(function(e){
  return e.es==="Activo"&&diasQuieto(e)>=diasDormido();})
  .sort(function(a,b){return diasQuieto(b)-diasQuieto(a);});}
function altasFrenadas(){return S.socios.filter(function(e){
  return e.es==="En alta"&&diasQuieto(e)>=diasAlta();})
  .sort(function(a,b){return diasQuieto(b)-diasQuieto(a);});}

/* ---------- períodos y actividad ---------- */
function lunesDe(semanasAtras){
  var d=new Date(); var dow=(d.getDay()+6)%7;      // 0 = lunes
  d.setDate(d.getDate()-dow-(semanasAtras*7));
  return isoDe(d);
}
function primeroDeMes(mesesAtras){
  var d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-mesesAtras);
  return isoDe(d);
}
function finDeMes(mesesAtras){
  var d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-mesesAtras+1); d.setDate(0);
  return isoDe(d);
}
function periodos(){
  var h=hoyISO();
  if(V.per==="semana"){
    var l0=lunesDe(0), l1=lunesDe(1);
    var finAnt=isoDe(new Date(Date.parse(l0+"T00:00:00")-864e5));
    return {ahora:[l0,h], antes:[l1,finAnt], et:"esta semana", ea:"la semana pasada"};
  }
  return {ahora:[primeroDeMes(0),h], antes:[primeroDeMes(1),finDeMes(1)],
          et:"este mes", ea:"el mes pasado"};
}
/* Cuenta entradas del historial de tipo k dentro de un rango de fechas */
function contar(k,ini,fin){
  var n=0;
  S.socios.forEach(function(e){
    (e.log||[]).forEach(function(l){
      if(l.k===k&&l.f>=ini&&l.f<=fin)n++;
    });
  });
  return n;
}
function sociosTocados(ini,fin){
  var n=0;
  S.socios.forEach(function(e){
    if((e.log||[]).some(function(l){return l.f>=ini&&l.f<=fin&&l.k&&l.k!=="+";}))n++;
  });
  return n;
}

/* ---------- render ---------- */
var renderizando=false, renderPendiente=false, claveSheet=null;
function render(){
  if(renderizando){renderPendiente=true;return;}
  renderizando=true;
  // soltar el foco ANTES de reemplazar el DOM: si no, el blur dispara un change
  // en medio del innerHTML y el navegador tira NotFoundError
  var ae=document.activeElement;
  if(ae&&(ae.tagName==="INPUT"||ae.tagName==="TEXTAREA"))ae.blur();
  // la ficha (.sheet) tiene su propio scroll: al reconstruir todo el HTML se
  // pierde, así que lo guardamos y lo devolvemos si sigue siendo la misma
  // ficha (o el mismo paso de la carga por lista) — si no, arranca en 0.
  var hojaAntes=document.querySelector(".sheet");
  var scrollAntes=hojaAntes?hojaAntes.scrollTop:0;
  var claveAntes=claveSheet;
  var claveAhora=V.imp?("imp"+V.imp.paso):(V.abierta!=null?("f"+V.abierta):null);
  try{ pintar(); centrarActivos(); } finally { renderizando=false; }
  var hojaAhora=document.querySelector(".sheet");
  if(hojaAhora&&claveAhora&&claveAhora===claveAntes)hojaAhora.scrollTop=scrollAntes;
  claveSheet=claveAhora;
  if(renderPendiente){renderPendiente=false;render();}
}
function centrarActivos(){
  [[".states",'[aria-pressed="true"]'],[".fbar",'[aria-pressed="true"]']].forEach(function(par){
    var cont=document.querySelector(par[0]); if(!cont)return;
    var act=cont.querySelector(par[1]); if(!act)return;
    var x=act.offsetLeft-(cont.clientWidth-act.offsetWidth)/2;
    cont.scrollLeft=Math.max(0,x);
  });
}
function pintar(){
  var tot=S.socios.length||1;
  var activos=S.socios.filter(function(e){return e.es==="Activo";}).length;
  var enJuego=S.socios.filter(function(e){
    return ["Contactado","Reunión","Interesado","En alta"].indexOf(e.es)>=0;}).length;
  var alertas=posiblesDormidos().length+altasFrenadas().length;
  var pend=vencidas().length;

  var h='<div class="shell">'
   +'<header class="top"><div class="top-row">'
   +'<span class="brand">ACL<small>red de socios</small></span>'
   +'</div>'
   +'<div class="bar">'
   +'<i class="b-ok" style="width:'+(activos/tot*100)+'%"></i>'
   +'<i class="b-go" style="width:'+(enJuego/tot*100)+'%"></i>'
   +'</div>'
   +'<div class="barlab"><span><em>'+activos+'</em> '+(activos===1?"activo":"activos")+'</span>'
   +'<span><em>'+enJuego+'</em> en juego</span>'
   +'<span><em>'+S.socios.length+'</em> en total</span>'
   +'<span id="saved" class="saved ok">Guardado</span></div>'
   +'</header><main>';

  if(V.tab==="hoy")          h+=vistaHoy();
  else if(V.tab==="socios")  h+=vistaSocios();
  else if(V.tab==="tablero") h+=vistaTablero();
  else                       h+=vistaAjustes();

  h+='</main>'
   +'<nav class="tabs"><div class="tabs-in">'
   + tab("hoy","Hoy",'<path d="M3 11l18-8-8 18-2-8-8-2z"/>',pend+alertas)
   + tab("socios","Socios",'<path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/>',0)
   + tab("tablero","Tablero",'<path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/>',0)
   + tab("ajustes","Ajustes",'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-2.9 1.2V21a2 2 0 11-4 0v-.1A1.7 1.7 0 006 19.4l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00-1.2-2.9H2a2 2 0 110-4h.1A1.7 1.7 0 003.4 6l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 002.9-1.2V2a2 2 0 114 0v.1A1.7 1.7 0 0018 3.4l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 001.2 2.9H22a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/>',0)
   +'</div></nav></div>';

  if(V.imp){h+=pantallaImportar();}
  else if(V.abierta!=null){var e=porId(V.abierta); if(e)h+=ficha(e);}
  ROOT.innerHTML=h;
  marcar(estadoGuardado);
}
function tab(id,label,path,badge){
  return '<button class="tab" data-tab="'+id+'" aria-selected="'+(V.tab===id)+'" role="tab">'
   +'<svg viewBox="0 0 24 24" aria-hidden="true">'+path+'</svg><span>'+label+'</span>'
   +(badge>0?'<span class="badge">'+badge+'</span>':'')+'</button>';
}

function tarjeta(e){
  var st=estadoDe(e);
  var cls=st==="cerr"?"card":"card s-"+st;
  var sub=[e.ti||"", e.lo||""].filter(Boolean).join(" · ");
  var when="";
  if(e.pxf&&!CERRADO[e.es]){
    var d=diasEntre(hoyISO(),e.pxf);
    when='<div class="c-when '+(d<0?"urg":d===0?"hoy":"fut")+'">'

/* =====================================================================
   CARGA POR LISTA
   Pegás lo que copiaste de un Excel o de Google Sheets y la app sola
   se da cuenta de cómo viene: por tabulaciones, por punto y coma, por
   comas o una columna sola de nombres. Después le decís a cada columna
   qué es, ves cómo va a quedar, y recién ahí se carga.
   ===================================================================== */
var CAMPOS=[["","Ignorar"],["n","Nombre"],["tel","Teléfono"],["lo","Localidad"],
            ["dir","Dirección"],["de","Con quién hablo"],["ob","Nota"]];
var NOMBRE_CAMPO={n:"Nombre",tel:"Teléfono",lo:"Localidad",dir:"Dirección",
                  de:"Con quién hablo",ob:"Nota"};

function sinTildes(t){
  return String(t||"").replace(/[áàäâã]/g,"a").replace(/[éèëê]/g,"e")
    .replace(/[íìïî]/g,"i").replace(/[óòöôõ]/g,"o").replace(/[úùüû]/g,"u")
    .replace(/ñ/g,"n");
}
/* Para comparar nombres: sin tildes, sin puntuación, sin dobles espacios
   y sin las palabras que no distinguen nada (SA, SRL, "agencia"…). */
var RUIDO=/\b(s\.?a\.?|s\.?r\.?l\.?|sas|scs|cia|compania|hnos|hermanos|e\s*hijos|automotores|automotor|agencia|concesionaria)\b/g;
function normNombre(t){
  var base=sinTildes(String(t||"").toLowerCase())
    .replace(/\./g,"")                      // s.a. y sa tienen que dar lo mismo
    .replace(/[^a-z0-9\s]/g," ");
  var x=base.replace(RUIDO," ").replace(/\s+/g," ").trim();
  if(!x)x=base.replace(/\s+/g," ").trim();  // un nombre que era todo ruido no queda en la nada
  return x;
}
/* Parte una línea respetando las comillas, como hace el Excel. */
function partir(l,d){
  if(!d)return [l];
  var out=[],cur="",q=false;
  for(var i=0;i<l.length;i++){
    var c=l.charAt(i);
    if(c==='"'){ if(q&&l.charAt(i+1)==='"'){cur+='"';i++;} else q=!q; }
    else if(c===d&&!q){out.push(cur);cur="";}
    else cur+=c;
  }
  out.push(cur);
  return out;
}
function detectarSep(lineas){
  var m=lineas.slice(0,12);
  var tabs=0; m.forEach(function(l){tabs+=l.split("\t").length-1;});
  if(tabs>0)return "\t";                       // pegado desde Excel o Sheets
  var uniforme=function(d){
    var n=null, ok=true;
    m.forEach(function(l){var k=partir(l,d).length;
      if(n===null)n=k; else if(k!==n)ok=false;});
    return ok&&n>1;
  };
  if(uniforme(";"))return ";";
  if(uniforme(","))return ",";
  return "";                                    // una sola columna de nombres
}
function pareceTelefono(v){
  var t=String(v||"").trim();
  if(!t)return false;
  if(!/^[\d\s()+\-./]+$/.test(t))return false;
  var d=t.replace(/[^\d]/g,"");
  return d.length>=7&&d.length<=15;
}
var CABEZAS=[
  ["lo",/localidad|ciudad|pueblo|zona|partido|loc\./i],
  ["dir",/direcc|domicil|calle|ubicac|altura/i],
  ["tel",/tel|cel|whats|m[oó]vil|movil|n[uú]mero/i],
  ["de",/due[nñ]|encargad|titular|referen|responsable|contacto|persona/i],
  ["ob",/nota|observ|origen|coment|detalle/i],
  ["n",/nombre|socio|agencia|raz[oó]n|empresa|comercio|negocio|concesionaria/i]
];
function adivinarCabeza(txt){
  var t=String(txt||"").trim();
  if(!t)return "";
  for(var i=0;i<CABEZAS.length;i++)if(CABEZAS[i][1].test(t))return CABEZAS[i][0];
  return "";
}
/* Arma el mapa de columnas: con títulos, por el nombre del título;
   sin títulos, la primera es el nombre y las que parecen teléfono, teléfono. */
function mapearColumnas(A){
  var mapa=[], i, j;
  if(A.cab){
    mapa=A.filas[0].map(adivinarCabeza);
  }else{
    for(i=0;i<A.ancho;i++)mapa.push("");
    for(j=1;j<A.ancho;j++){
      var col=A.filas.map(function(f){return f[j];}).filter(function(v){return v!=="";});
      var tel=col.filter(pareceTelefono).length;
      if(col.length&&tel/col.length>=0.6)mapa[j]="tel";
    }
  }
  if(mapa.indexOf("n")<0)mapa[0]="n";
  return mapa;
}
function analizarPegado(txt){
  var lineas=String(txt||"").split(/\r?\n/)
    .map(function(l){return l.replace(/\s+$/,"");})
    .filter(function(l){return l.trim()!=="";});
  if(!lineas.length)return null;
  var sep=detectarSep(lineas);
  var filas=lineas.map(function(l){
    return partir(l,sep).map(function(c){return c.trim().replace(/^"|"$/g,"").trim();});
  });
  var ancho=filas.reduce(function(m,f){return Math.max(m,f.length);},0);
  filas.forEach(function(f){while(f.length<ancho)f.push("");});
  var prim=filas[0];
  var aciertos=0;
  prim.forEach(function(c){if(adivinarCabeza(c))aciertos++;});
  var cab = filas.length>1 && aciertos>=Math.max(1,Math.ceil(ancho/2))
            && !prim.some(pareceTelefono);
  var A={sep:sep, filas:filas, ancho:ancho, cab:cab};
  A.mapa=mapearColumnas(A);
  return A;
}
/* Qué va a pasar con cada fila: nueva, repetida contra la base,
   repetida dentro de la misma lista, o sin nombre. */
function filasDeCarga(){
  var A=V.imp&&V.imp.an; if(!A)return [];
  var datos=A.filas.slice(A.cab?1:0);
  var vistos={};
  S.socios.forEach(function(e){var k=normNombre(e.n); if(k)vistos[k]="base";});
  var out=[];
  datos.forEach(function(f){
    var r={n:"",tel:"",lo:"",dir:"",de:"",ob:""};
    A.mapa.forEach(function(c,i){ if(c&&!r[c])r[c]=(f[i]||"").trim(); });
    if(!r.n){out.push({r:r,estado:"sin"});return;}
    var k=normNombre(r.n);
    if(vistos[k]){out.push({r:r,estado:vistos[k]==="base"?"base":"lista"});return;}
    vistos[k]="lista";
    out.push({r:r,estado:"nuevo"});
  });
  return out;
}

/* ---------- vista: Tablero ---------- */
function kpi(label,ahora,antes,nota,ancho){
  var d=ahora-antes, cls="", txt="";
  if(antes===0&&ahora===0)      txt="igual que "+P.ea;
  else if(d>0)                  {cls="up";   txt="+"+d+" que "+P.ea;}
  else if(d<0)                  {cls="down"; txt=d+" que "+P.ea;}
  else                          txt="igual que "+P.ea;
  return '<div class="kpi'+(ancho?" wide":"")+'">'
   +'<div class="k-l">'+esc(label)+'</div>'
   +'<div class="k-v">'+ahora+'</div>'
   +'<div class="k-n '+cls+'">'+esc(txt)+(nota?" · "+esc(nota):"")+'</div></div>';
}

     +'Ver quiénes son en la pestaña Hoy</button>';
  }

  ramas().forEach(function(r){porRama[r]=0;});
  S.socios.forEach(function(e){
    var vc={}, vr={};
    (e.ac||[]).forEach(function(ac){
      if(ac.co&&porComp[ac.co]!=null&&!vc[ac.co]){porComp[ac.co]++;vc[ac.co]=1;}

         +'<span class="fn">'+porRama[r]+'</span></div>';}).join("")
     +'</div></section>';

function usoDeValor(campo,valor){
  var n=0;
  S.socios.forEach(function(e){

    (e.ac||[]).forEach(function(a){if(a[campo]===valor)n++;});

/* ---------- CSV ---------- */
function csv(){
  var cols=["ID","Socio","Tipo","Estado","Temperatura","Localidad","Dirección",
    "Contacto","Qué es","Teléfono","WhatsApp","Mail","CUIT","Volumen",
    "Aseguradora actual","Condición actual","Primera póliza",
    "Próxima acción","Fecha próxima acción","Pasos del alta hechos","Acuerdos",
    "Observaciones","Historial"];
  var rows=[cols];
  S.socios.forEach(function(e){
    var acs=(e.ac||[]).map(function(a){
      return [a.co||"?",a.ra||"?",a.fp||"a definir",(a.pc?a.pc:""),(a.det||"")]
        .filter(Boolean).join(" / ");}).join("  ||  ");
    var alt=Object.keys(e.alta||{}).filter(function(k){return e.alta[k];})
      .map(function(k){return k+" ("+dmy(e.alta[k])+")";}).join(", ");
    rows.push([e.id,e.n,e.ti,e.es,e.temp,e.lo,e.dir,e.de,e.ca,e.tel,e.wa||"",e.em,
      e.cuit,e.vol,e.aseg,e.cond,e.p1||"",e.px,e.pxf,alt,acs,e.ob,
      (e.log||[]).map(function(l){return dmy(l.f)+" "+l.t+(l.d?": "+l.d:"");}).join(" | ")]);
  });
  return "﻿"+rows.map(function(r){return r.map(function(c){
    c=String(c==null?"":c);return '"'+c.replace(/"/g,'""')+'"';}).join(";");}).join("\r\n");
}
function bajarCSV(){
  try{
    var b=new Blob([csv()],{type:"text/csv;charset=utf-8"});
    var a=document.createElement("a");
    a.href=URL.createObjectURL(b);
    a.download="socios_"+hoyISO()+".csv";
    document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1000);
    toast("CSV descargado");
  }catch(x){toast("No se pudo bajar el CSV");}
}

    c_lo:"lo",c_dir:"dir",c_ob:"ob",c_ti:"ti",c_p1:"p1",

/* ---------- eventos ---------- */
document.addEventListener("click",function(ev){
  var t=ev.target.closest("[data-tab],[data-open],[data-close],[data-acc],[data-est],"
    +"[data-dias],[data-nota],[data-add],[data-csv],[data-vermas],[data-temp],[data-paso],"
    +"[data-addac],[data-quitarac],[data-borrar],[data-quitar],[data-agregar],[data-per],[data-limpiar],"
    +"[data-imp],[data-impcerrar],[data-imprevisar],[data-impvolver],[data-impcargar],[data-deslog]");
  if(!t)return;
  var e=V.abierta!=null?porId(V.abierta):null;
  var d=t.dataset;

  if(d.tab){V.tab=d.tab;V.verMas=false;V.abierta=null;render();window.scrollTo(0,0);return;}
  if(d.open){V.abierta=Number(d.open);render();window.scrollTo(0,0);return;}
  if(d.close){leerCampos(e);if(e)guardar(e);V.abierta=null;render();return;}
  if(d.vermas){V.verMas=!V.verMas;render();return;}
  if(d.per){V.per=d.per;render();return;}
  if(d.limpiar){V.fTipo="";V.fEstado="";V.fRama="";V.fComp="";render();return;}
  if(d.csv){bajarCSV();return;}
  if(d.add){agregar();return;}

  /* --- carga por lista --- */
  if(d.imp){V.imp={paso:1,txt:"",tipo:"",origen:"",an:null};V.abierta=null;
    render();window.scrollTo(0,0);return;}
  if(d.impcerrar){
    var escrito=(val("imp-txt")||V.imp.txt||"").trim();
    if(escrito&&!confirm("¿Salir sin cargar la lista?"))return;
    V.imp=null;render();return;}
  if(d.imprevisar){
    var tx=val("imp-txt")||"";
    V.imp.txt=tx; V.imp.tipo=val("imp-tipo")||""; V.imp.origen=(val("imp-origen")||"").trim();
    var A=analizarPegado(tx);
    if(!A){toast("Pegá la lista primero");return;}
    V.imp.an=A; V.imp.paso=2; render(); window.scrollTo(0,0); return;}
  if(d.impvolver){V.imp.paso=1;render();window.scrollTo(0,0);return;}
  if(d.impcargar){cargarLista();return;}
  if(d.borrar){borrar(Number(d.borrar));return;}

  /* --- configuración --- */
  if(d.quitar){
    var arr=lista(d.quitar).slice();
    var it=arr[Number(d.i)];
    var nom=typeof it==="string"?it:it.n;
    var usos=d.campo?usoDeValor(d.campo,nom):0;
    if(usos>0){toast('"'+nom+'" está usado en '+plural(usos,"registro","registros")+'. '
      +"Cambialos primero.");return;}
    if(!confirm('¿Sacar "'+nom+'" de la lista?'))return;
    arr.splice(Number(d.i),1);
    S.cfg[d.quitar]=arr; guardarCfg(); render(); return;
  }
  if(d.agregar){
    var inp=document.getElementById("add-"+d.agregar);
    var v=inp?inp.value.trim():"";
    if(!v){toast("Escribí el nombre primero");return;}
    var actual=lista(d.agregar).slice();
    var ya=actual.some(function(x){
      return (typeof x==="string"?x:x.n).toLowerCase()===v.toLowerCase();});
    if(ya){toast("Ya está en la lista");return;}
    if(d.agregar==="tipos"){
      var chk=document.getElementById("add-tipos-ag");
      actual.push({n:v, ag:!!(chk&&chk.checked)});
    }else actual.push(v);
    S.cfg[d.agregar]=actual; guardarCfg(); render();
    toast('"'+v+'" agregado'); return;
  }

  if(!e)return;
  if(d.acc){leerCampos(e);aplicar(e,d.acc);return;}
  if(d.temp){leerCampos(e);
    e.temp = e.temp===d.temp ? "" : d.temp;
    guardar(e);render();return;}
  if(d.est){leerCampos(e);
    if(e.es!==d.est){e.es=d.est;e.log.push({f:hoyISO(),t:"Estado → "+e.es,d:"",k:"e"});}
    guardar(e);render();return;}
  if(d.dias!=null){var n=Number(d.dias);
    leerCampos(e); e.pxf=n<0?"":masDias(n); guardar(e);render();return;}
  if(d.paso){
    leerCampos(e);
    if(!e.alta)e.alta={};
    if(e.alta[d.paso]){delete e.alta[d.paso];}
    else{e.alta[d.paso]=hoyISO();
      e.log.push({f:hoyISO(),t:"Alta: "+d.paso,d:"",k:"a2"});}
    guardar(e);render();return;}
  if(d.addac){
    leerCampos(e);
    if(!e.ac)e.ac=[];
    e.ac.push({co:"",ra:"",fp:"",pc:"",det:""});
    guardar(e);render();return;}
  if(d.quitarac){
    leerCampos(e);
    var i=Number(d.quitarac);
    var a=e.ac[i];
    if(!confirm("¿Quitar el acuerdo "+((a.co||"sin compañía")+" · "+(a.ra||"sin rama"))+"?"))return;
    e.ac.splice(i,1); guardar(e);render();return;}
  if(d.deslog){
    if(!e.log||!e.log.length)return;
    var ult=e.log[e.log.length-1];
    if(!confirm('¿Deshacer "'+ult.t+'"'+(ult.d?" ("+ult.d+")":"")+'? No se puede volver atrás.'))return;
    leerCampos(e);
    e.log.pop();
    var eraLaActivacion = e.p1 && e.p1===ult.f && ult.k==="p";
    if(eraLaActivacion)e.p1="";
    guardar(e);render();
    toast("Registro deshecho"+(eraLaActivacion
      ?" · ya no cuenta como primera póliza. Revisá el estado, puede que haya que corregirlo también."
      :""));
    return;}
  if(d.nota){
    var ta=document.getElementById("nota");
    var v2=ta?ta.value.trim():"";
    if(!v2){toast("Escribí algo primero");return;}
    leerCampos(e);
    e.log.push({f:hoyISO(),t:"Nota",d:v2,k:"n"});
    guardar(e);render();toast("Nota guardada");return;}
});

/* ---------- login, carga y sincronización ---------- */
function pantalla(html){ROOT.innerHTML='<div class="gate"><div class="gate-in">'+html+'</div></div>';}

function pantallaLogin(msg){
  pantalla('<h1 class="gate-t">ACL · Red de socios</h1>'
   +'<p class="gate-p">Seguimiento de agencias, dateros y vendedores que te traen pólizas.</p>'

   +'<div class="fld"><label for="pass">Contraseña</label>'
   +'<input id="pass" type="password" autocomplete="current-password" placeholder="••••••••"></div>'
   +'<button class="act" id="entrar">Entrar</button>'
   +(msg?'<p class="gate-e">'+esc(msg)+'</p>':'')
   +'<p class="gate-n">Los usuarios se crean desde el panel de Supabase, en '
   +'Authentication → Users, con Auto Confirm marcado.</p>');

  var b=document.getElementById("entrar");
  function intentar(){
    var m=(document.getElementById("mail").value||"").trim();
    var p=document.getElementById("pass").value||"";
    if(!m||m.indexOf("@")<0){pantallaLogin("Escribí tu mail completo.");return;}
    if(!p){pantallaLogin("Te falta la contraseña.");return;}
    b.textContent="Entrando…"; b.disabled=true;
    sb.auth.signInWithPassword({email:m,password:p}).then(function(r){
      if(r.error)pantallaLogin(mensajeError(r.error));
    }).catch(function(){pantallaLogin("No se pudo conectar. Revisá que tengas internet.");});
  }
  b.addEventListener("click",intentar);
  document.getElementById("pass").addEventListener("keydown",function(ev){
    if(ev.key==="Enter")intentar();
  });
}
function mensajeError(err){
  var t=((err&&err.message)||"").toLowerCase();
  if(t.indexOf("invalid login")>=0)      return "Mail o contraseña incorrectos.";
  if(t.indexOf("email not confirmed")>=0)return "El usuario existe pero está sin confirmar. "
    +"En Supabase → Authentication → Users, editalo y marcá Auto Confirm.";
  if(t.indexOf("rate limit")>=0||t.indexOf("too many")>=0)
    return "Demasiados intentos seguidos. Esperá un minuto y probá de nuevo.";
  return (err&&err.message)||"No se pudo entrar.";
}

function normalizarSocio(d){
  d.ac=Array.isArray(d.ac)?d.ac:[];
  d.alta=(d.alta&&typeof d.alta==="object")?d.alta:{};
  d.log=Array.isArray(d.log)?d.log:[];
  ["n","ti","lo","dir","de","ca","tel","wa","em","temp","es","px","pxf",
   "cuit","vol","aseg","cond","p1","ob"].forEach(function(k){
    if(d[k]==null)d[k]="";
  });
  if(!d.es)d.es="Identificado";
  return d;
}
var cargando=false;
function cargar(){
  if(cargando)return Promise.resolve();
  cargando=true;
  pantalla('<h1 class="gate-t">Cargando…</h1><p class="gate-p">Trayendo los socios.</p>');
  return Promise.all([
    sb.from("socios").select("id,datos").order("id"),
    sb.from("config").select("k,v")
  ]).then(function(res){
    if(res[0].error)throw res[0].error;
    S.socios=(res[0].data||[]).map(function(r){var d=r.datos||{};d.id=r.id;return normalizarSocio(d);});
    (res[1].data||[]).forEach(function(c){S.cfg[c.k]=c.v;});
    cachear(); cargando=false; render(); escuchar();
  }).catch(function(err){
    cargando=false;
    var raw=null; try{raw=localStorage.getItem(CACHE);}catch(x){}
    if(raw){
      try{
        var g=JSON.parse(raw);
        S.socios=(g.socios||[]).map(normalizarSocio);
        S.cfg=g.cfg||S.cfg;
        render(); marcar("err");
        toast("Sin conexión: estás viendo la última copia guardada");
        return;
      }catch(y){}
    }
    pantalla('<h1 class="gate-t">No se pudo conectar</h1>'
      +'<p class="gate-p">'+esc((err&&err.message)||"Revisá la conexión y recargá.")+'</p>'
      +'<p class="gate-n">Si dice algo de "permission denied", falta agregar tu mail '
      +'en la tabla <b>permitidos</b> de Supabase.</p>');
  });
}

function escuchar(){
  sb.channel("acl")
    .on("postgres_changes",{event:"*",schema:"public",table:"socios"},function(p){
      if(p.eventType==="DELETE"){
        var vid=p.old&&p.old.id;
        if(vid!=null){S.socios=S.socios.filter(function(x){return x.id!==vid;});cachear();render();}
        return;
      }
      var fila=p.new; if(!fila||!fila.datos)return;
      if(Date.now()-(ultimaEscritura[fila.id]||0)<4000)return;  // eco de mi propia escritura
      var d=normalizarSocio(fila.datos); d.id=fila.id;
      var i=-1; for(var k=0;k<S.socios.length;k++)if(S.socios[k].id===fila.id){i=k;break;}
      if(i<0)S.socios.push(d); else S.socios[i]=d;
      cachear(); render();
    })
    .on("postgres_changes",{event:"*",schema:"public",table:"config"},function(p){
      if(p.new&&p.new.k){S.cfg[p.new.k]=p.new.v;cachear();render();}
    })
    .subscribe();
}

function rolDelJWT(k){
  var p=k.split("."); if(p.length!==3)return "";
  try{
    var b=p[1].replace(/-/g,"+").replace(/_/g,"/");
    while(b.length%4)b+="=";
    return (JSON.parse(atob(b)).role)||"";
  }catch(x){return "";}
}

  pantalla('<h1 class="gate-t">Configurar la conexión</h1>'
   +'<p class="gate-p">Pegá los dos datos de tu proyecto de Supabase. Están en '
   +'<b>Settings → API Keys</b>. Sirve la <b>Publishable key</b> (pestaña API Keys) '
   +'o la vieja <b>anon public</b> (pestaña Legacy API Keys): son equivalentes.</p>'
   +'<div class="fld"><label for="cu">Project URL</label>'
   +'<input id="cu" type="url" placeholder="https://xxxx.supabase.co" autocapitalize="off" spellcheck="false"></div>'
   +'<div class="fld"><label for="ck">Publishable key — o anon public</label>'
   +'<textarea id="ck" placeholder="sb_publishable_... o eyJ..." autocapitalize="off" spellcheck="false"></textarea></div>'
   +'<button class="act" id="probar">Probar la conexión</button>'
   +(msg?'<p class="gate-e">'+esc(msg)+'</p>':'')
   +'<p class="gate-n">La <b>service_role</b> / <b>secret key</b> no va acá: esa da acceso total '
   +'y nunca tiene que estar en una página web.</p>');

  document.getElementById("probar").addEventListener("click",function(){
    var b=this;
    var u=(document.getElementById("cu").value||"").trim().replace(/\/+$/,"");
    var k=(document.getElementById("ck").value||"").trim();
    if(!/^https:\/\/.+\.supabase\.co$/.test(u)){
      pantallaConfig("La Project URL tiene que verse así: https://algo.supabase.co");return;}
    if(k.indexOf("service_role")>=0||k.indexOf("sb_secret_")===0||rolDelJWT(k)==="service_role"){
      pantallaConfig("Esa es la clave secreta (service_role). Nunca va en una página web. "
        +"Volvé y copiá la Publishable key, o la anon public de la pestaña Legacy.");return;}
    if(k.length<20){pantallaConfig("La clave parece incompleta. Copiala entera.");return;}
    b.textContent="Probando…"; b.disabled=true;
    fetch(u+"/rest/v1/",{headers:{apikey:k}}).then(function(r){
      if(r.status===401||r.status===403){pantallaConfig("La clave no es válida para ese proyecto.");return;}
      if(!r.ok&&r.status!==404){pantallaConfig("El proyecto no respondió (código "+r.status+"). Revisá la URL.");return;}
      try{localStorage.setItem(CFG,JSON.stringify({url:u,key:k}));}catch(x){}
      pantalla('<h1 class="gate-t">Conectado</h1>'
        +'<p class="gate-p">Ya funciona en este celular. Para que funcione en cualquier otro '
        +'sin volver a configurarlo, bajá el archivo con la configuración adentro y subilo '
        +'a tu hosting reemplazando el actual.</p>'
        +'<button class="act" id="bajar">Bajar el archivo configurado</button>'
        +'<button class="salir" id="seguir">Seguir sin bajarlo</button>');
      document.getElementById("bajar").addEventListener("click",function(){
        var out=PAGINA_SRC.replace('"PEGAR_AQUI_LA_PROJECT_URL"',JSON.stringify(u))
                          .replace('"PEGAR_AQUI_LA_CLAVE_PUBLISHABLE"',JSON.stringify(k));
        var bl=new Blob([out],{type:"text/html;charset=utf-8"});
        var a=document.createElement("a");a.href=URL.createObjectURL(bl);
        a.download="index.html";document.body.appendChild(a);a.click();
        setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1000);
      });
      document.getElementById("seguir").addEventListener("click",function(){location.reload();});
    }).catch(function(){pantallaConfig("No se pudo conectar. Revisá la URL y que tengas internet.");});
  });
}

document.addEventListener("click",function(ev){
  if(ev.target.id==="salir"&&sb){sb.auth.signOut().then(function(){location.reload();});}
  if(ev.target.id==="clave"&&sb){
    var n=prompt("Nueva contraseña (mínimo 6 caracteres)");
    if(!n)return;
    if(n.length<6){toast("Tiene que tener al menos 6 caracteres");return;}
    sb.auth.updateUser({password:n}).then(function(r){
      toast(r.error?("No se pudo cambiar: "+r.error.message):"Contraseña cambiada");
    });
  }
});

function arrancar(){
  if(SUPABASE_URL.indexOf("PEGAR_AQUI")===0||SUPABASE_KEY.indexOf("PEGAR_AQUI")===0){
    pantallaConfig(""); return;
  }
  if(!window.supabase){
    pantalla('<h1 class="gate-t">No cargó una librería</h1>'
     +'<p class="gate-p">La página necesita conexión la primera vez que la abrís. '
     +'Conectate y recargá; después funciona aunque no tengas señal.</p>');
    return;
  }
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,
      {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  sb.auth.onAuthStateChange(function(evt,ses){
    var antes=!!sesion; sesion=ses;
    miEmail=ses&&ses.user?ses.user.email:"";
    if(ses&&!antes&&!cargando)cargar();
    if(!ses&&antes)pantallaLogin("");
  });
  sb.auth.getSession().then(function(r){
    sesion=r.data.session;
    if(sesion){miEmail=sesion.user.email;cargar();}
    else pantallaLogin("");
  });
}

/* ---------- PWA: instalarla y que abra sin señal ---------- */
if("serviceWorker" in navigator){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("./sw.js").catch(function(){});
  });
}

arrancar();
})();
</script>
